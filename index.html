<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I'm Sorry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fdf2f8; --bg2:#f3e8ff; --bg3:#fff7f0;
  --card:#ffffffee; --text:#524a5e; --sub:#9187a0; --accent:#c58fb8;
  --accent2:#a993c9; --shadow:rgba(160,130,180,.22); --border:#f0e2ee;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#241f2b; --bg2:#2a2233; --bg3:#231e29;
    --card:#2f2838ee; --text:#ece6f2; --sub:#b3a5c2; --accent:#d9a6cc;
    --accent2:#b79ee0; --shadow:rgba(0,0,0,.35); --border:#3a3145;
  }
}
:root[data-theme="dark"]{
  --bg1:#241f2b; --bg2:#2a2233; --bg3:#231e29;
  --card:#2f2838ee; --text:#ece6f2; --sub:#b3a5c2; --accent:#d9a6cc;
  --accent2:#b79ee0; --shadow:rgba(0,0,0,.35); --border:#3a3145;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  font-family:'Quicksand',sans-serif; color:var(--text);
  background:linear-gradient(135deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  min-height:100%;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  overflow-x:hidden;
}
.stage{position:relative; min-height:100vh; min-height:100dvh; width:100%;}
.step{display:none; opacity:0; transform:translateY(18px); transition:opacity .8s ease, transform .8s ease;}
.step.active{display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; min-height:100dvh; padding:24px; text-align:center; cursor:pointer;}
.step.visible{opacity:1; transform:translateY(0);}
#step3.active{display:block; min-height:0; cursor:default; padding:48px 20px 64px;}
.card{
  background:var(--card); border-radius:32px; padding:48px 36px;
  box-shadow:0 20px 60px var(--shadow); backdrop-filter:blur(6px);
  border:1px solid var(--border); max-width:420px; width:100%;
}
.arrow{font-size:1.3rem; color:var(--accent2); opacity:.6; animation:float 2.4s ease-in-out infinite;}
.arrow.up{margin-bottom:14px;} .arrow.down{margin-top:14px; animation-delay:.3s;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(6px);}}
.circle{
  width:150px; height:150px; margin:0 auto; border-radius:50%;
  border:2px solid var(--accent2); display:flex; align-items:center; justify-content:center;
  font-size:2.6rem; font-weight:600; color:var(--accent2);
  animation:pop .9s cubic-bezier(.2,.9,.3,1.3);
}
@keyframes pop{from{opacity:0; transform:scale(.7);} to{opacity:1; transform:scale(1);}}
.msg{font-size:1.5rem; font-weight:600; line-height:1.5; color:var(--text);}
.hint{margin-top:22px; font-size:.85rem; color:var(--sub);}
h1.title{font-family:'Caveat',cursive; font-size:2.6rem; color:var(--accent2); text-align:center; margin:0 0 36px;}
.grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:14px;
  max-width:1000px; margin:0 auto;
}
.lang{
  background:var(--card); border:1px solid var(--border); border-radius:20px;
  padding:16px 10px; text-align:center; box-shadow:0 6px 18px var(--shadow);
  transition:transform .25s ease, box-shadow .25s ease;
}
.lang:hover, .lang:active{transform:translateY(-4px) scale(1.03); box-shadow:0 12px 26px var(--shadow);}
.lang .word{font-size:1.15rem; font-weight:600; color:var(--accent2);}
.lang .name{font-size:.72rem; color:var(--sub); margin-top:6px;}
.soundBtn{
  position:fixed; top:calc(env(safe-area-inset-top,0px) + 14px); right:16px;
  width:42px; height:42px; border-radius:50%; border:1px solid var(--border);
  background:var(--card); color:var(--accent2); font-size:1.1rem; z-index:10;
  display:flex; align-items:center; justify-content:center; box-shadow:0 6px 16px var(--shadow); cursor:pointer;
}
</style>
</head>
<body>
<button class="soundBtn" id="soundBtn" title="Soft music">🔈</button>
<div class="stage">
  <section id="step1" class="step active">
    <div class="card">
      <div class="arrow up">↑</div>
      <div class="circle">Hi</div>
      <div class="arrow down">↓</div>
    </div>
    <div class="hint">tap anywhere</div>
  </section>

  <section id="step2" class="step">
    <div class="card">
      <div class="arrow up">↑</div>
      <div class="msg">I just wanted<br>to say sorry</div>
      <div class="arrow down">↓</div>
    </div>
    <div class="hint">tap anywhere</div>
  </section>

  <section id="step3" class="step">
    <h1 class="title">Sorry, in every language</h1>
    <div class="grid" id="grid"></div>
  </section>
</div>

<script>
const langs=[["English","Sorry"],["Spanish","Lo siento"],["French","Désolé"],["German","Es tut mir leid"],
["Italian","Mi dispiace"],["Portuguese","Desculpa"],["Japanese","ごめんなさい"],["Korean","미안해요"],
["Chinese (Simplified)","对不起"],["Chinese (Traditional)","對不起"],["Hindi","माफ़ करना"],["Arabic","آسف"],
["Russian","Извините"],["Turkish","Özür dilerim"],["Dutch","Het spijt me"],["Swedish","Förlåt"],
["Polish","Przepraszam"],["Greek","Συγγνώμη"],["Hebrew","סליחה"],["Thai","ขอโทษ"],
["Vietnamese","Xin lỗi"],["Indonesian","Maaf"],["Filipino","Paumanhin"],["Bengali","দুঃখিত"],
["Urdu","معاف کیجئے"],["Persian","ببخشید"],["Swahili","Samahani"],["Finnish","Anteeksi"],
["Norwegian","Beklager"],["Danish","Undskyld"],["Czech","Promiňte"],["Hungarian","Sajnálom"],
["Romanian","Îmi pare rău"],["Ukrainian","Вибачте"],["Croatian","Oprosti"],["Serbian","Извини"],
["Slovak","Prepáč"],["Bulgarian","Съжалявам"],["Malay","Maaf"],["Tamil","மன்னிக்கவும்"],
["Telugu","క్షమించండి"],["Punjabi","ਮੁਆਫ਼ ਕਰਨਾ"],["Gujarati","માફ કરશો"],["Marathi","माफ करा"],
["Nepali","माफ गर्नुहोस्"],["Sinhala","සමාවෙන්න"],["Burmese","တောင်းပန်ပါတယ်"],["Khmer","សុំទោស"],
["Mongolian","Уучлаарай"],["Icelandic","Fyrirgefðu"]];
const grid=document.getElementById('grid');
grid.innerHTML=langs.map(l=>`<div class="lang"><div class="word">${l[1]}</div><div class="name">${l[0]}</div></div>`).join('');

const steps=[...document.querySelectorAll('.step')];
let timer;
function showStep(n){
  steps.forEach(s=>s.classList.remove('active','visible'));
  const el=document.getElementById('step'+n);
  el.classList.add('active');
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('visible')));
}
function advance(n){ clearTimeout(timer); showStep(n); }
document.getElementById('step1').addEventListener('click',()=>advance(2));
document.getElementById('step2').addEventListener('click',()=>advance(3));
timer=setTimeout(()=>advance(2),2600);
document.getElementById('step2').addEventListener('transitionend',function h(e){
  if(e.propertyName==='opacity' && this.classList.contains('visible')){
    timer=setTimeout(()=>advance(3),2600);
    this.removeEventListener('transitionend',h);
  }
});

// gentle synthesized ambient pad, muted by default
let ctx,on=false,nodes=[];
const btn=document.getElementById('soundBtn');
btn.addEventListener('click',()=>{
  try{
    if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)();
    if(!on){
      ctx.resume();
      const master=ctx.createGain(); master.gain.value=0.045; master.connect(ctx.destination);
      [261.6,329.6,392.0].forEach((f,i)=>{
        const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f;
        const g=ctx.createGain(); g.gain.value=0;
        o.connect(g); g.connect(master); o.start();
        g.gain.linearRampToValueAtTime(1,ctx.currentTime+1.5+i*.3);
        nodes.push(o,g);
      });
      btn.textContent='🔊'; on=true;
    }else{
      nodes.forEach(n=>{try{n.stop&&n.stop(); n.disconnect();}catch(e){}});
      nodes=[]; btn.textContent='🔈'; on=false;
    }
  }catch(e){}
});
</script>
</body>
</html>
